name: Build APWorld

on:
  push:
    paths:
      - 'worlds/**'
      - 'tools/**'
      - 'players/**'
      - '.github/workflows/build-apworld.yml'
  pull_request:
    paths:
      - 'worlds/**'
      - 'tools/**'
      - 'players/**'
      - '.github/workflows/build-apworld.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install PyYAML
      - name: Validate
        run: python tools/validate_world.py
      - name: Build APWorld
        run: |
          python tools/build_apworld.py \
            --source worlds/ragnarok_online \
            --output dist/ragnarok_online.apworld
      - name: Upload APWorld artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ragnarok_online.apworld
          path: dist/ragnarok_online.apworld
          if-no-files-found: error
